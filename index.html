<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healing Hands - Hero Section</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-gold: #D4AF37;
            --gold-light: #F3E5AB;
            --text-light: #F8FAFC;
            --text-gray: #CBD5E1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0B192C;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }

        /* Hero Section Container พร้อมไล่เฉดสีน้ำเงินพรีเมียม และเอฟเฟกต์ประกายวิบวับเบาๆ */
        .hero-section {
            position: relative;
            padding: 100px 30px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0A182F 0%, #162C4E 50%, #0F203C 100%);
            overflow: hidden;
        }

        /* เอฟเฟกต์ประกายวิบวับเคลื่อนไหวเบาๆ ด้านหลัง */
        .hero-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.8) 1.2px, transparent 0),
                radial-gradient(rgba(212, 175, 55, 0.7) 1.8px, transparent 0);
            background-size: 220px 220px, 300px 300px;
            background-position: 0 0, 80px 120px;
            opacity: 0.35;
            animation: sparkleFloat 20s linear infinite;
            z-index: 1;
        }

        @keyframes sparkleFloat {
            0% { background-position: 0 0, 80px 120px; }
            50% { opacity: 0.5; }
            100% { background-position: 220px 220px, 380px 420px; }
        }

        .hero-container {
            position: relative;
            z-index: 2;
            max-width: 1350px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.25fr;
            gap: 60px;
            align-items: center;
        }

        /* ฝั่งซ้าย: ข้อความ */
        .hero-content h1 {
            font-size: clamp(38px, 4.5vw, 56px);
            line-height: 1.2;
            margin-bottom: 20px;
            color: var(--text-light);
        }

        .hero-content h1 span {
            color: var(--accent-gold);
            font-style: italic;
            text-shadow: 0 2px 15px rgba(212, 175, 55, 0.3);
        }

        .hero-content p {
            font-size: 17px;
            color: var(--text-gray);
            margin-bottom: 35px;
            max-width: 520px;
            line-height: 1.8;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-gold {
            background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
            color: #000;
            padding: 13px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.5);
        }

        .btn-outline-gold {
            background: transparent;
            color: var(--text-light);
            border: 1px solid rgba(212, 175, 55, 0.5);
            padding: 13px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s;
        }

        .btn-outline-gold:hover {
            background: rgba(212, 175, 55, 0.1);
            border-color: var(--accent-gold);
        }

        /* ฝั่งขวา: ช่องวิดีโอกว้างพิเศษ ขอบทองหรูหรา */
        .hero-video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(212, 175, 55, 0.5);
            background: #000;
            aspect-ratio: 16/10;
        }

        .hero-video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-tag-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(11, 25, 44, 0.85);
            color: var(--accent-gold);
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            border: 1px solid var(--accent-gold);
            z-index: 10;
            letter-spacing: 0.5px;
        }

        /* Responsive สำหรับมือถือ: ตัวหนังสือบน วิดีโอล่าง */
        @media (max-width: 968px) {
            .hero-container {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 40px;
            }
            .hero-content p {
                margin-left: auto;
                margin-right: auto;
            }
            .hero-buttons {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="hero-container">
            <!-- ฝั่งซ้าย: ข้อความ -->
            <div class="hero-content">
                <h1>Professional Wellness <span>at Your Location</span></h1>
                <p>Experience luxury mobile massage service in Bangkok, Pattaya and Phuket. Our professional certified therapists bring absolute relaxation straight to your hotel room or condo within 30–40 minutes.</p>
                <div class="hero-buttons">
                    <a href="#" class="btn-gold">💬 Book on WhatsApp</a>
                    <a href="#" class="btn-outline-gold">View Prices</a>
                </div>
            </div>

            <!-- ฝั่งขวา: ช่องวิดีโอของคุณ (เล่นอัตโนมัติ ปิดเสียง วนลูป) -->
            <div class="hero-video-wrapper">
                <div class="video-tag-badge">✨ HEALING HANDS VIDEO</div>
                <video autoplay muted loop playsinline>
                    <source src="75216b58-b124-4c9c-92e8-139fb0a27e81.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>
    </section>

</body>
</html>
